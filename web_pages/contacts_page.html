<!doctype html>
<html lang="ru">

<div class="container text-start">


    <div class="row justify-content-start">


        <div class="col-md-3 text-bg-dark p-3 d-flex flex-column" style="height: 100vh">

            <hr>

            <div class="list-group">

                <a href="#" class="list-group-item list-group-item-action bg-primary text-white border-0"
                   aria-current="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"

                    </svg>
                    <i class="bi bi-journal"></i> Категории
                </a>
                <a href="#" class="list-group-item list-group-item-action bg-transparent text-white border-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                         class="bi bi-table" viewBox="0 0 16 16">
                        <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm15 2h-4v3h4zm0 4h-4v3h4zm0 4h-4v3h3a1 1 0 0 0 1-1zm-5 3v-3H6v3zm-5 0v-3H1v2a1 1 0 0 0 1 1zm-4-4h4V8H1zm0-4h4V4H1zm5-3v3h4V4zm4 4H6v3h4z"/>
                    </svg>
                    <i class="bi bi-card-checklist"></i> Заказы
                </a>
                <a href="#" class="list-group-item list-group-item-action bg-transparent text-white border-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                         class="bi bi-person-circle" viewBox="0 0 16 16">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                        <path fill-rule="evenodd"
                              d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                    </svg>
                    <i class="bi bi-person"></i> Контакты
                </a>
            </div>

            <hr class="mt-auto">
            <div style="display: flex; align-items: center; white-space: nowrap; overflow-x: auto;">
                <div class="img-container" style="width: 30px; height: 30px; overflow: hidden; flex-shrink: 0;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                         class="bi bi-person-arms-up" viewBox="0 0 16 16">
                        <path d="M8 3a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3"/>
                        <path d="m5.93 6.704-.846 8.451a.768.768 0 0 0 1.523.203l.81-4.865a.59.59 0 0 1 1.165 0l.81 4.865a.768.768 0 0 0 1.523-.203l-.845-8.451A1.5 1.5 0 0 1 10.5 5.5L13 2.284a.796.796 0 0 0-1.239-.998L9.634 3.84a.7.7 0 0 1-.33.235c-.23.074-.665.176-1.304.176-.64 0-1.074-.102-1.305-.176a.7.7 0 0 1-.329-.235L4.239 1.286a.796.796 0 0 0-1.24.998l2.5 3.216c.317.316.475.758.43 1.204Z"/>
                    </svg>
                </div>
                <select class="form-select w-auto" aria-label="Default select example"
                        style="background-color: transparent; color: white; border: none; margin-left: 10px;">
                    <option selected hidden>Пользователь</option>
                    <option value="1" style="background-color: #444444; color: white;">Профиль</option>
                    <option value="2" style="background-color: #444444; color: white;">Выход</option>
                </select>
            </div>
        </div>


        <div class="col-md-9">
            <div class="container d-flex vh-100">
                <div class="row justify-content-center align-items-center">
                    <div class="text-center" style="margin: 0; padding: 0;">
                        <p class="h1">Контакты</p>
                    </div>

                    <div class="container">
                        <div class="row">
                            <div class="col-md-6">
                                <form>
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Имя</label>
                                        <input type="text" class="form-control" id="name">
                                    </div>
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Почта</label>
                                        <div class="input-group flex-nowrap">
                                            <span class="input-group-text" id="addon-wrapping">@</span>
                                            <input type="email" class="form-control" id="email">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="message" class="form-label">Сообщение</label>
                                        <textarea class="form-control" id="message" rows="3"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Отправить</button>
                                </form>
                            </div>
                            <div class="col-md-6">
                                <h3>Наши контакты</h3>
                                <p>Тут должны быть наши контакты, но пока это скрытая информация :)</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
